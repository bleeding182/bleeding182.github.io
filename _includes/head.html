<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Follows the system unless the reader pins a theme, in which case theme.js
       replaces both tags with a single unconditional one. -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFF8F6"/>
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1A1110"/>

  <!-- Applies a pinned theme before first paint, and locks out Dark Reader when
       the reader pinned a theme or we are already dark. This has to happen here
       rather than in theme.js: Dark Reader reads the lock as the document loads,
       so a lock added later in the bundle comes too late for this page view. -->
  <script>
    (function() {
      var stored = null;
      try {
        stored = localStorage.getItem('theme');
      } catch (e) {}

      if (stored !== 'light' && stored !== 'dark') {
        stored = null;
      }

      if (stored) {
        document.documentElement.setAttribute('data-theme', stored);
      }

      var dark = stored
        ? stored === 'dark'
        : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;

      // A pinned theme is an explicit choice and outranks Dark Reader, light
      // included - without this it inverts our pinned light theme on every page
      // load. Following the system, only dark needs the lock.
      if (stored || dark) {
        var meta = document.createElement('meta');
        meta.name = 'darkreader-lock';
        document.head.appendChild(meta);
      }
    })();
  </script>

  {%- seo -%}
  {%- feed_meta -%}

  <link rel="icon" type="image/svg+xml" href="{{ "/favicon.svg" | prepend: site.baseurl }}">

  <link rel="stylesheet" href="{{ "/css/fonts.css" | prepend: site.baseurl }}"/>
  <link rel="stylesheet" href="{{ "/css/site.css" | prepend: site.baseurl }}"/>

  {%- if paginator.page > 1 -%}
  <meta name="robots" content="noindex">
  {%- endif -%}

  <!-- View Transitions API - Enable crossfade between pages -->
  <!-- Requires Chrome/Edge 126+ (June 2024) - Falls back gracefully in unsupported browsers -->
  <style>
    @view-transition {
      navigation: auto;
    }
  </style>

  <!-- Material Web Components -->
  <script type="module" src="{{ "/assets/bundle.js" | prepend: site.baseurl }}"></script>
</head>
